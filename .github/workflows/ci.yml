name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install render-test dependencies
        run: npm install --no-save --no-package-lock react@18.3.1 react-dom@18.3.1
      - name: Syntax and offline render test
        run: node --check index.js && npm run check
        env:
          REACT_ROOT: ${{ github.workspace }}
